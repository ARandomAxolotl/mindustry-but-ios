name: Build iOS IPA so i cam finally live

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Mindustry
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Clone Arc
        run: |
          git clone --depth=1 --branch=master \
            https://github.com/Anuken/Arc ../Arc

      - name: Fetch MetalANGLEKit
        run: |
          ./gradlew -p ../Arc :backends:backend-robovm:extractMetalANGLEKit

      - name: Build IPA
        run: |
          chmod +x ./gradlew
          ./gradlew ios:createIPA

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: mindustry-ios
          path: ios/build/**/*.ipa